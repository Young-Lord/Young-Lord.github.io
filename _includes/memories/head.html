{%- if page.id == 'page-memories' -%}
<link rel="stylesheet" href="/assets/css/memories.css">
{%- assign _accent = site.data.memories.accent -%}
{%- if _accent -%}<style>.memories-controls,spoiler{--mem-accent:{{ _accent }};}</style>{%- endif -%}
<script>
  window.MEMORIES_CONFIG = {{ site.data.memories | jsonify }};
  // 在表格渲染前就把保存的偏好应用成 html 的 class，避免剧透/类别闪一下
  (function () {
    try {
      var classes = document.documentElement.classList;
      var defaults = window.MEMORIES_CONFIG.defaults || {};
      var stored = JSON.parse(window.localStorage.getItem('memories:prefs:v1') || '{}');
      var pref = function (key, fallback) {
        return typeof stored[key] === 'boolean' ? stored[key] : !!fallback;
      };
      classes.add('memories-js');
      if (!pref('hideSpoiler', defaults.hide_spoiler !== false)) { classes.add('memories-show-spoiler'); }
      if (pref('hideNsfw', defaults.hide_nsfw)) { classes.add('memories-hide-nsfw'); }
      if (!pref('hideSubCategory', defaults.hide_sub_category !== false)) { classes.add('memories-show-subcat'); }
    } catch (e) { /* 没有 localStorage 就用默认值 */ }
  })();
</script>
<script src="/assets/js/memories.js" defer></script>
{%- endif -%}
